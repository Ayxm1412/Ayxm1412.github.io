<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d7-seam-title d7-seam-desc" id="d-11-cordis-capability-seam-root">
      <title id="d7-seam-title">Capability Seam 三角色</title>
      <desc id="d7-seam-desc">以 ctx.fs 为例：Service Definition 拥有抽象类、类型和 key，是标准；Provider（fs-local/sandbox/ssh）实现它；Consumer（tool-fs）只 inject key 并调用。Cordis 内核按 scope 解析出当前激活的 provider，策略监听器在 fs/* waterfall 上拦截，消费者无需知道具体实现。</desc>
      <defs>
      <style>#d-11-cordis-capability-seam-root { --paper: #f5f7fb; --ink: #2c3a55; --muted: #5b6d8c; --soft: #5b6d8c;
    --accent: #be4a22; --accent-tint: rgba(190,74,34,0.08); --rule: rgba(44,58,85,0.14);
    --sans: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
    --mono: 'SF Mono', Menlo, Consolas, monospace; }
      #d-11-cordis-capability-seam-root { font-family: var(--sans); color: var(--ink); }
      #d-11-cordis-capability-seam-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-11-cordis-capability-seam-root .diagram-container { overflow-x: visible; }</style>
        <marker id="d-11-cordis-capability-seam-d7-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b6d8c"/></marker>
        <marker id="d-11-cordis-capability-seam-d7-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#be4a22"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f7fb"/>

      <!-- arrows (drawn before nodes) -->
      <line x1="264" y1="290" x2="384" y2="290" stroke="#5b6d8c" stroke-width="1.2" marker-end="url(#d-11-cordis-capability-seam-d7-arrow)"/>
      <line x1="576" y1="290" x2="696" y2="290" stroke="#be4a22" stroke-width="1.4" marker-end="url(#d-11-cordis-capability-seam-d7-arrow-accent)"/>
      <path d="M168,250 V120 Q168,112 176,112 H360" fill="none" stroke="#5b6d8c" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#d-11-cordis-capability-seam-d7-arrow)"/>
      <path d="M792,250 V120 Q792,112 784,112 H600" fill="none" stroke="#5b6d8c" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#d-11-cordis-capability-seam-d7-arrow)"/>
      <line x1="480" y1="420" x2="480" y2="330" stroke="#5b6d8c" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#d-11-cordis-capability-seam-d7-arrow)"/>

      <!-- arrow labels -->
      <rect x="276" y="270" width="72" height="12" rx="2" fill="#f5f7fb"/>
      <text x="312" y="279" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="8" fill="#5b6d8c" text-anchor="middle" letter-spacing="0.06em">inject ctx.fs</text>
      <rect x="596" y="270" width="72" height="12" rx="2" fill="#f5f7fb"/>
      <text x="632" y="279" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="500" fill="#be4a22" text-anchor="middle">解析激活</text>
      <rect x="200" y="172" width="56" height="16" rx="2" fill="#f5f7fb"/>
      <text x="228" y="184" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="500" fill="#5b6d8c" text-anchor="middle">依赖契约</text>
      <rect x="700" y="172" width="40" height="16" rx="2" fill="#f5f7fb"/>
      <text x="720" y="184" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="500" fill="#5b6d8c" text-anchor="middle">实现</text>
      <rect x="488" y="366" width="72" height="16" rx="2" fill="#f5f7fb"/>
      <text x="524" y="378" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="500" fill="#5b6d8c" text-anchor="middle">拦截调用</text>

      <!-- Service Definition (focal) -->
      <rect x="360" y="72" width="240" height="80" rx="6" fill="#f5f7fb"/>
      <rect x="360" y="72" width="240" height="80" rx="6" fill="#be4a22" stroke="#be4a22" stroke-width="1.2" fill-opacity="0.08"/>
      <text x="480" y="106" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2c3a55" text-anchor="middle">Service Definition</text>
      <text x="480" y="126" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="9" fill="#5b6d8c" text-anchor="middle">abstract class + ctx.fs</text>

      <!-- Consumer -->
      <rect x="72" y="250" width="192" height="80" rx="6" fill="#f5f7fb"/>
      <rect x="72" y="250" width="192" height="80" rx="6" fill="#ffffff" stroke="#2c3a55" stroke-width="1"/>
      <text x="168" y="284" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2c3a55" text-anchor="middle">Consumer</text>
      <text x="168" y="304" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="9" fill="#5b6d8c" text-anchor="middle">tool-fs</text>

      <!-- Cordis kernel -->
      <rect x="384" y="250" width="192" height="80" rx="6" fill="#f5f7fb"/>
      <rect x="384" y="250" width="192" height="80" rx="6" fill="#2c3a55" stroke="#5b6d8c" stroke-width="1" fill-opacity="0.05"/>
      <text x="480" y="284" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2c3a55" text-anchor="middle">Cordis 内核</text>
      <text x="480" y="304" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="9" fill="#5b6d8c" text-anchor="middle">reflect / registry</text>

      <!-- Provider -->
      <rect x="696" y="250" width="192" height="80" rx="6" fill="#f5f7fb"/>
      <rect x="696" y="250" width="192" height="80" rx="6" fill="#ffffff" stroke="#2c3a55" stroke-width="1"/>
      <text x="792" y="284" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2c3a55" text-anchor="middle">Provider</text>
      <text x="792" y="304" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="9" fill="#5b6d8c" text-anchor="middle">fs-local/sandbox/ssh</text>

      <!-- Policy listener -->
      <rect x="384" y="420" width="192" height="70" rx="6" fill="#f5f7fb"/>
      <rect x="384" y="420" width="192" height="70" rx="6" fill="#2c3a55" stroke="#2c3a55" stroke-width="1" stroke-dasharray="4,3" fill-opacity="0.02" stroke-opacity="0.30"/>
      <text x="480" y="450" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2c3a55" text-anchor="middle">策略监听器</text>
      <text x="480" y="470" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="9" fill="#5b6d8c" text-anchor="middle">fs/* waterfall</text>

      <!-- legend -->
      <line x1="40" y1="512" x2="920" y2="512" stroke="#2c3a55" stroke-width="0.8" stroke-opacity="0.14"/>
      <text x="40" y="536" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#2c3a55">标准由 Definition 包拥有；换 provider（本地↔沙箱↔远程）时 consumer 一行不改。集合由 gen-doc-graphs.ts 扫声明生成。</text>
    </svg>
