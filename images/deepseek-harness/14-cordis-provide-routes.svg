<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d10-provide-title d10-provide-desc" id="d-14-cordis-provide-routes-root">
      <title id="d10-provide-title">提供能力的三条路</title>
      <desc id="d10-provide-desc">加一个能力时的决策：如果是某个已有 seam 的一种实现，就注册进那个 registry（推荐，天然不冲突）；如果需要同名不同实现，用 isolate 按作用域区分；否则定义一个新 Service 占用新的 ctx key，同一作用域重名会在加载时直接抛错。</desc>
      <defs>
      <style>#d-14-cordis-provide-routes-root { --paper: #f5f7fb; --ink: #2c3a55; --muted: #5b6d8c; --soft: #5b6d8c;
    --accent: #be4a22; --accent-tint: rgba(190,74,34,0.08); --rule: rgba(44,58,85,0.14);
    --sans: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
    --mono: 'SF Mono', Menlo, Consolas, monospace; }
      #d-14-cordis-provide-routes-root { font-family: var(--sans); color: var(--ink); }
      #d-14-cordis-provide-routes-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-14-cordis-provide-routes-root .diagram-container { overflow-x: visible; }</style>
        <marker id="d-14-cordis-provide-routes-d10-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b6d8c"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f7fb"/>

      <!-- arrows (before nodes) -->
      <line x1="480" y1="86" x2="480" y2="120" stroke="#5b6d8c" stroke-width="1.2" marker-end="url(#d-14-cordis-provide-routes-d10-arrow)"/>
      <line x1="610" y1="168" x2="670" y2="168" stroke="#5b6d8c" stroke-width="1.2" marker-end="url(#d-14-cordis-provide-routes-d10-arrow)"/>
      <line x1="480" y1="216" x2="480" y2="248" stroke="#5b6d8c" stroke-width="1.2" marker-end="url(#d-14-cordis-provide-routes-d10-arrow)"/>
      <line x1="610" y1="296" x2="670" y2="296" stroke="#5b6d8c" stroke-width="1.2" marker-end="url(#d-14-cordis-provide-routes-d10-arrow)"/>
      <line x1="480" y1="344" x2="480" y2="392" stroke="#5b6d8c" stroke-width="1.2" marker-end="url(#d-14-cordis-provide-routes-d10-arrow)"/>

      <!-- branch labels -->
      <rect x="628" y="146" width="24" height="16" rx="2" fill="#f5f7fb"/>
      <text x="640" y="158" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="500" fill="#5b6d8c" text-anchor="middle">是</text>
      <rect x="488" y="224" width="24" height="16" rx="2" fill="#f5f7fb"/>
      <text x="500" y="236" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="500" fill="#5b6d8c" text-anchor="middle">否</text>
      <rect x="628" y="274" width="24" height="16" rx="2" fill="#f5f7fb"/>
      <text x="640" y="286" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="500" fill="#5b6d8c" text-anchor="middle">是</text>
      <rect x="488" y="360" width="24" height="16" rx="2" fill="#f5f7fb"/>
      <text x="500" y="372" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="500" fill="#5b6d8c" text-anchor="middle">否</text>

      <!-- annotation near S -->
      <text x="650" y="420" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-style="italic" fill="#5b6d8c">同一作用域重名 →</text>
      <text x="650" y="440" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-style="italic" fill="#5b6d8c">加载即抛错（唯一性由框架保证）</text>

      <!-- start -->
      <rect x="380" y="42" width="200" height="44" rx="22" fill="#f5f7fb"/>
      <rect x="380" y="42" width="200" height="44" rx="22" fill="#ffffff" stroke="#2c3a55" stroke-width="1"/>
      <text x="480" y="69" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2c3a55" text-anchor="middle">加一个能力</text>

      <!-- decision 1 -->
      <path d="M480,120 L610,168 L480,216 L350,168 Z" fill="#f5f7fb"/>
      <path d="M480,120 L610,168 L480,216 L350,168 Z" fill="#ffffff" stroke="#2c3a55" stroke-width="1"/>
      <text x="480" y="172" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2c3a55" text-anchor="middle">是已有 seam 的实现?</text>

      <!-- R: register into existing registry (accent, recommended) -->
      <rect x="670" y="136" width="220" height="64" rx="6" fill="#f5f7fb"/>
      <rect x="670" y="136" width="220" height="64" rx="6" fill="#be4a22" stroke="#be4a22" stroke-width="1.2" fill-opacity="0.08"/>
      <text x="780" y="164" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2c3a55" text-anchor="middle">注册进已有 registry</text>
      <text x="780" y="182" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="9" fill="#5b6d8c" text-anchor="middle">ctx.llm / tools / web</text>

      <!-- decision 2 -->
      <path d="M480,248 L610,296 L480,344 L350,296 Z" fill="#f5f7fb"/>
      <path d="M480,248 L610,296 L480,344 L350,296 Z" fill="#ffffff" stroke="#2c3a55" stroke-width="1"/>
      <text x="480" y="300" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2c3a55" text-anchor="middle">需按作用域区分?</text>

      <!-- I: isolate -->
      <rect x="670" y="264" width="220" height="64" rx="6" fill="#f5f7fb"/>
      <rect x="670" y="264" width="220" height="64" rx="6" fill="#ffffff" stroke="#2c3a55" stroke-width="1"/>
      <text x="780" y="292" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2c3a55" text-anchor="middle">用 isolate 作用域</text>
      <text x="780" y="310" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="9" fill="#5b6d8c" text-anchor="middle">ctx.isolate(name)</text>

      <!-- S: new Service -->
      <rect x="330" y="392" width="300" height="64" rx="6" fill="#f5f7fb"/>
      <rect x="330" y="392" width="300" height="64" rx="6" fill="#ffffff" stroke="#2c3a55" stroke-width="1"/>
      <text x="480" y="420" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2c3a55" text-anchor="middle">定义新 Service（新 ctx key）</text>
      <text x="480" y="438" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="9" fill="#5b6d8c" text-anchor="middle">provide('abc')</text>

      <!-- legend -->
      <line x1="40" y1="496" x2="920" y2="496" stroke="#2c3a55" stroke-width="0.8" stroke-opacity="0.14"/>
      <text x="40" y="520" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#2c3a55">默认注册进已有 seam（llm/tools/web），天然不冲突；确需新 ctx key 才定义 Service（重名 loud fail）；同名不同实现用 isolate 分作用域。</text>
    </svg>
