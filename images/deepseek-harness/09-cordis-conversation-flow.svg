<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 648" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d5-flow-title d5-flow-desc" id="d-09-cordis-conversation-flow-root">
      <title id="d5-flow-title">一次真实对话的数据流</title>
      <desc id="d5-flow-desc">时序图：客户端经 SessionController 恢复 Agent，AgentLoop 开一个 turn，组装 prompt 与工具、调 ctx.llm 流式返回、把 user/assistant/tool 事件追加进 Session Log，工具经 seam 执行，log 的 session/event 再推回客户端渲染，直到 turn 结束。</desc>
      <defs>
      <style>#d-09-cordis-conversation-flow-root { --paper: #f5f7fb; --ink: #2c3a55; --muted: #5b6d8c; --soft: #5b6d8c; --link: #1e5bc6;
    --accent: #be4a22; --accent-tint: rgba(190,74,34,0.08); --rule: rgba(44,58,85,0.14);
    --sans: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
    --mono: 'SF Mono', Menlo, Consolas, monospace; }
      #d-09-cordis-conversation-flow-root { font-family: var(--sans); color: var(--ink); }
      #d-09-cordis-conversation-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-09-cordis-conversation-flow-root .diagram-container { overflow-x: visible; }</style>
        <marker id="d-09-cordis-conversation-flow-d5-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b6d8c"/></marker>
        <marker id="d-09-cordis-conversation-flow-d5-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1e5bc6"/></marker>
        <marker id="d-09-cordis-conversation-flow-d5-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#be4a22"/></marker>
        <marker id="d-09-cordis-conversation-flow-d5-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#5b6d8c" stroke-width="1.2"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f7fb"/>

      <!-- lifelines -->
      <line x1="116" y1="100" x2="116" y2="560" stroke="#2c3a55" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
      <line x1="292" y1="100" x2="292" y2="560" stroke="#2c3a55" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
      <line x1="468" y1="100" x2="468" y2="560" stroke="#2c3a55" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
      <line x1="644" y1="100" x2="644" y2="560" stroke="#2c3a55" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
      <line x1="820" y1="100" x2="820" y2="560" stroke="#2c3a55" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>

      <!-- loop fragment frame -->
      <rect x="100" y="244" width="740" height="216" rx="4" fill="#2c3a55" stroke="#2c3a55" stroke-width="1" fill-opacity="0.02" stroke-opacity="0.22"/>
      <rect x="100" y="244" width="40" height="16" rx="2" fill="#f5f7fb" stroke="#2c3a55" stroke-width="1" stroke-opacity="0.22"/>
      <text x="120" y="256" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="8" fill="#5b6d8c" text-anchor="middle" letter-spacing="0.12em">LOOP</text>
      <text x="152" y="272" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#5b6d8c">[每个 step：一次模型请求 + 它的工具]</text>

      <!-- activation bar: Agent Loop holds control M2..M9 -->
      <rect x="464" y="176" width="8" height="316" fill="#2c3a55" stroke="#5b6d8c" stroke-width="0.8" fill-opacity="0.06"/>

      <!-- messages -->
      <line x1="116" y1="144" x2="292" y2="144" stroke="#1e5bc6" stroke-width="1.2" marker-end="url(#d-09-cordis-conversation-flow-d5-arrow-link)"/>
      <line x1="292" y1="176" x2="464" y2="176" stroke="#5b6d8c" stroke-width="1.2" marker-end="url(#d-09-cordis-conversation-flow-d5-arrow)"/>
      <line x1="468" y1="208" x2="820" y2="208" stroke="#5b6d8c" stroke-width="1.2" marker-end="url(#d-09-cordis-conversation-flow-d5-arrow)"/>
      <line x1="468" y1="300" x2="644" y2="300" stroke="#5b6d8c" stroke-width="1.2" marker-end="url(#d-09-cordis-conversation-flow-d5-arrow)"/>
      <line x1="644" y1="332" x2="116" y2="332" stroke="#5b6d8c" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#d-09-cordis-conversation-flow-d5-arrow-open)"/>
      <line x1="468" y1="364" x2="820" y2="364" stroke="#be4a22" stroke-width="1.4" marker-end="url(#d-09-cordis-conversation-flow-d5-arrow-accent)"/>
      <line x1="468" y1="396" x2="644" y2="396" stroke="#5b6d8c" stroke-width="1.2" marker-end="url(#d-09-cordis-conversation-flow-d5-arrow)"/>
      <line x1="468" y1="428" x2="820" y2="428" stroke="#5b6d8c" stroke-width="1.2" marker-end="url(#d-09-cordis-conversation-flow-d5-arrow)"/>
      <line x1="468" y1="492" x2="820" y2="492" stroke="#5b6d8c" stroke-width="1.2" marker-end="url(#d-09-cordis-conversation-flow-d5-arrow)"/>
      <line x1="820" y1="524" x2="116" y2="524" stroke="#5b6d8c" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#d-09-cordis-conversation-flow-d5-arrow-open)"/>

      <!-- message labels -->
      <rect x="182" y="126" width="44" height="12" rx="2" fill="#f5f7fb"/>
      <text x="204" y="135" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="8" fill="#1e5bc6" text-anchor="middle" letter-spacing="0.06em">prompt()</text>
      <rect x="344" y="158" width="72" height="12" rx="2" fill="#f5f7fb"/>
      <text x="380" y="167" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="8" fill="#5b6d8c" text-anchor="middle" letter-spacing="0.06em">resume · inbox</text>
      <rect x="684" y="190" width="96" height="12" rx="2" fill="#f5f7fb"/>
      <text x="732" y="199" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="8" fill="#5b6d8c" text-anchor="middle" letter-spacing="0.06em">turn/start·user/msg</text>
      <rect x="516" y="282" width="80" height="12" rx="2" fill="#f5f7fb"/>
      <text x="556" y="291" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="8" fill="#5b6d8c" text-anchor="middle" letter-spacing="0.06em">ctx.llm.stream()</text>
      <rect x="164" y="314" width="80" height="12" rx="2" fill="#f5f7fb"/>
      <text x="204" y="323" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="8" fill="#5b6d8c" text-anchor="middle" letter-spacing="0.06em">assistant-stream</text>
      <rect x="672" y="346" width="120" height="12" rx="2" fill="#f5f7fb"/>
      <text x="732" y="355" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="8" fill="#be4a22" text-anchor="middle" letter-spacing="0.06em">append assistant/message</text>
      <rect x="506" y="378" width="100" height="12" rx="2" fill="#f5f7fb"/>
      <text x="556" y="387" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="8" fill="#5b6d8c" text-anchor="middle" letter-spacing="0.06em">tool/call -&gt; fs/shell</text>
      <rect x="686" y="410" width="92" height="12" rx="2" fill="#f5f7fb"/>
      <text x="732" y="419" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="8" fill="#5b6d8c" text-anchor="middle" letter-spacing="0.06em">append tool/result</text>
      <rect x="694" y="474" width="76" height="12" rx="2" fill="#f5f7fb"/>
      <text x="732" y="483" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="8" fill="#5b6d8c" text-anchor="middle" letter-spacing="0.06em">append turn/end</text>
      <rect x="340" y="502" width="80" height="16" rx="2" fill="#f5f7fb"/>
      <text x="380" y="514" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="500" fill="#5b6d8c" text-anchor="middle">事件流→渲染</text>

      <!-- actor boxes -->
      <rect x="41" y="48" width="150" height="52" rx="6" fill="#f5f7fb"/>
      <rect x="41" y="48" width="150" height="52" rx="6" fill="#5b6d8c" stroke="#5b6d8c" stroke-width="1" fill-opacity="0.10"/>
      <text x="116" y="70" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2c3a55" text-anchor="middle">客户端 Client</text>
      <text x="116" y="88" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="9" fill="#5b6d8c" text-anchor="middle">browser/Electron</text>

      <rect x="217" y="48" width="150" height="52" rx="6" fill="#f5f7fb"/>
      <rect x="217" y="48" width="150" height="52" rx="6" fill="#ffffff" stroke="#2c3a55" stroke-width="1"/>
      <text x="292" y="70" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2c3a55" text-anchor="middle">SessionController</text>
      <text x="292" y="88" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="9" fill="#5b6d8c" text-anchor="middle">Host · remote</text>

      <rect x="393" y="48" width="150" height="52" rx="6" fill="#f5f7fb"/>
      <rect x="393" y="48" width="150" height="52" rx="6" fill="#be4a22" stroke="#be4a22" stroke-width="1" fill-opacity="0.08"/>
      <text x="468" y="70" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2c3a55" text-anchor="middle">Agent Loop</text>
      <text x="468" y="88" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="9" fill="#5b6d8c" text-anchor="middle">ctx.agentLoop</text>

      <rect x="569" y="48" width="150" height="52" rx="6" fill="#f5f7fb"/>
      <rect x="569" y="48" width="150" height="52" rx="6" fill="#ffffff" stroke="#2c3a55" stroke-width="1"/>
      <text x="644" y="70" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2c3a55" text-anchor="middle">能力 Seam</text>
      <text x="644" y="88" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="9" fill="#5b6d8c" text-anchor="middle">ctx.llm · ctx.tools</text>

      <rect x="745" y="48" width="150" height="52" rx="6" fill="#f5f7fb"/>
      <rect x="745" y="48" width="150" height="52" rx="6" fill="#2c3a55" stroke="#5b6d8c" stroke-width="1" fill-opacity="0.05"/>
      <text x="820" y="70" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2c3a55" text-anchor="middle">Session Log</text>
      <text x="820" y="88" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="9" fill="#5b6d8c" text-anchor="middle">ctx.sessions</text>

      <!-- legend -->
      <line x1="40" y1="584" x2="920" y2="584" stroke="#2c3a55" stroke-width="0.8" stroke-opacity="0.14"/>
      <text x="40" y="606" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#2c3a55">实线 = 同步调用 / append；虚线空心 = 异步流（assistant-stream、session/event，瞬时不入 log）；强调色 = 落库的关键持久事件。</text>
    </svg>
