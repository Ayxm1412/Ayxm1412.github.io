<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 588" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d16-two-tier-title d16-two-tier-desc" id="d-16-search-harness-two-tier-root">
      <title id="d16-two-tier-title">高 QPS 搜推 Agent Harness 两层架构</title>
      <desc id="d16-two-tier-desc">请求经复杂度路由分成两层：约 95% 走快路径（LangGraph DAG、一次编译、无 checkpointer、读缓存优先），约 5% 复杂 query 走 Agentic 路径（LangGraph + SSE 流式 + 硬上限）；两条路径都调用同一套开源接缝——vLLM/SGLang 模型服务、Redis 多级缓存（结果/召回集/排序，向量库 Milvus/Qdrant）、以及双轨落地（Surface 按 session_id 存 Redis、Trace 异步落 Kafka/OTel）。</desc>
      <defs>
      <style>#d-16-search-harness-two-tier-root { --paper: #f5f7fb; --ink: #2c3a55; --muted: #5b6d8c; --soft: #5b6d8c;
    --accent: #be4a22; --accent-tint: rgba(190,74,34,0.08); --rule: rgba(44,58,85,0.14);
    --link: #1e5bc6;
    --sans: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
    --mono: 'SF Mono', Menlo, Consolas, monospace; }
      #d-16-search-harness-two-tier-root { font-family: var(--sans); color: var(--ink); }
      #d-16-search-harness-two-tier-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-16-search-harness-two-tier-root .diagram-container { overflow-x: visible; }</style>
        <marker id="d-16-search-harness-two-tier-d16-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b6d8c"/></marker>
        <marker id="d-16-search-harness-two-tier-d16-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#be4a22"/></marker>
        <marker id="d-16-search-harness-two-tier-d16-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1e5bc6"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f7fb"/>

      <!-- ===== zone (painted first) ===== -->
      <rect x="700" y="124" width="224" height="348" rx="8" fill="#2c3a55" stroke="#2c3a55" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
      <rect x="712" y="128" width="180" height="16" rx="2" fill="#f5f7fb"/>
      <text x="716" y="140" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="500" fill="#5b6d8c">共享开源接缝 · 两路复用</text>

      <!-- ===== arrows (painted before nodes) ===== -->
      <!-- ingress -> router -->
      <line x1="148" y1="276" x2="196" y2="276" stroke="#5b6d8c" stroke-width="1.2" marker-end="url(#d-16-search-harness-two-tier-d16-arrow)"/>
      <!-- router -> fast (elbow up) -->
      <path d="M 328,262 H 366 Q 374,262 374,254 V 206 Q 374,198 382,198 H 420" fill="none" stroke="#5b6d8c" stroke-width="1.2" marker-end="url(#d-16-search-harness-two-tier-d16-arrow)"/>
      <!-- router -> agentic (elbow down, accent) -->
      <path d="M 328,294 H 366 Q 374,294 374,302 V 346 Q 374,354 382,354 H 420" fill="none" stroke="#be4a22" stroke-width="1.2" marker-end="url(#d-16-search-harness-two-tier-d16-arrow-accent)"/>
      <!-- fast -> zone (link) -->
      <line x1="620" y1="198" x2="700" y2="198" stroke="#1e5bc6" stroke-width="1.2" marker-end="url(#d-16-search-harness-two-tier-d16-arrow-link)"/>
      <!-- agentic -> zone (link) -->
      <line x1="620" y1="354" x2="700" y2="354" stroke="#1e5bc6" stroke-width="1.2" marker-end="url(#d-16-search-harness-two-tier-d16-arrow-link)"/>

      <!-- ===== arrow labels (masks before nodes) ===== -->
      <rect x="626" y="176" width="68" height="16" rx="2" fill="#f5f7fb"/>
      <text x="660" y="188" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="500" fill="#5b6d8c" text-anchor="middle">读写 · 调用</text>
      <rect x="626" y="332" width="68" height="16" rx="2" fill="#f5f7fb"/>
      <text x="660" y="344" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="500" fill="#5b6d8c" text-anchor="middle">流式 · 读写</text>

      <!-- ===== node 1: ingress ===== -->
      <rect x="36" y="242" width="112" height="68" rx="6" fill="#f5f7fb"/>
      <rect x="36" y="242" width="112" height="68" rx="6" fill="#5b6d8c" stroke="#5b6d8c" stroke-width="1" fill-opacity="0.10"/>
      <rect x="44" y="248" width="28" height="12" rx="2" fill="none" stroke="#2c3a55" stroke-width="0.8" stroke-opacity="0.30"/>
      <text x="58" y="257" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="7" font-weight="500" letter-spacing="0.08em" fill="#5b6d8c" text-anchor="middle">API</text>
      <text x="92" y="284" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2c3a55" text-anchor="middle">搜推请求</text>
      <text x="92" y="300" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="9" fill="#5b6d8c" text-anchor="middle">POST /search</text>

      <!-- ===== node 2: router (focal) ===== -->
      <rect x="196" y="244" width="132" height="64" rx="6" fill="#f5f7fb"/>
      <rect x="196" y="244" width="132" height="64" rx="6" fill="#be4a22" stroke="#be4a22" stroke-width="1.2" fill-opacity="0.08"/>
      <rect x="204" y="250" width="34" height="12" rx="2" fill="none" stroke="#2c3a55" stroke-width="0.8" stroke-opacity="0.30"/>
      <text x="221" y="259" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="7" font-weight="500" letter-spacing="0.08em" fill="#5b6d8c" text-anchor="middle">GATE</text>
      <text x="262" y="284" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2c3a55" text-anchor="middle">复杂度路由</text>
      <text x="262" y="300" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="9" fill="#5b6d8c" text-anchor="middle">Router</text>

      <!-- ===== node 3: fast path ===== -->
      <rect x="420" y="132" width="200" height="132" rx="6" fill="#f5f7fb"/>
      <rect x="420" y="132" width="200" height="132" rx="6" fill="#ffffff" stroke="#2c3a55" stroke-width="1"/>
      <rect x="428" y="138" width="34" height="12" rx="2" fill="none" stroke="#2c3a55" stroke-width="0.8" stroke-opacity="0.30"/>
      <text x="445" y="147" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="7" font-weight="500" letter-spacing="0.08em" fill="#5b6d8c" text-anchor="middle">FAST</text>
      <text x="520" y="166" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2c3a55" text-anchor="middle">快路径 · Fast Path</text>
      <text x="520" y="184" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="9" fill="#5b6d8c" text-anchor="middle">LangGraph DAG · no ckpt</text>
      <text x="520" y="206" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#5b6d8c" text-anchor="middle">~95% 流量 · 读缓存优先</text>
      <text x="520" y="226" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#5b6d8c" text-anchor="middle">召回 → 粗排 → 精排 → 合成</text>
      <text x="520" y="246" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#5b6d8c" text-anchor="middle">无 checkpointer · 编译一次</text>

      <!-- ===== node 4: agentic path (focal) ===== -->
      <rect x="420" y="288" width="200" height="132" rx="6" fill="#f5f7fb"/>
      <rect x="420" y="288" width="200" height="132" rx="6" fill="#be4a22" stroke="#be4a22" stroke-width="1.2" fill-opacity="0.08"/>
      <rect x="428" y="294" width="52" height="12" rx="2" fill="none" stroke="#2c3a55" stroke-width="0.8" stroke-opacity="0.30"/>
      <text x="454" y="303" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="7" font-weight="500" letter-spacing="0.08em" fill="#5b6d8c" text-anchor="middle">AGENTIC</text>
      <text x="520" y="322" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2c3a55" text-anchor="middle">Agentic 路径</text>
      <text x="520" y="340" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="9" fill="#5b6d8c" text-anchor="middle">LangGraph + SSE</text>
      <text x="520" y="362" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#5b6d8c" text-anchor="middle">~5% 复杂 query · 流式返回</text>
      <text x="520" y="382" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#5b6d8c" text-anchor="middle">plan → 工具环 → 合成</text>
      <text x="520" y="402" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#5b6d8c" text-anchor="middle">硬上限：轮次 / 时延 / token</text>

      <!-- ===== node 5: LLM seam ===== -->
      <rect x="724" y="160" width="176" height="76" rx="6" fill="#f5f7fb"/>
      <rect x="724" y="160" width="176" height="76" rx="6" fill="#2c3a55" stroke="#2c3a55" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
      <rect x="732" y="166" width="36" height="12" rx="2" fill="none" stroke="#2c3a55" stroke-width="0.8" stroke-opacity="0.30"/>
      <text x="750" y="175" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="7" font-weight="500" letter-spacing="0.08em" fill="#5b6d8c" text-anchor="middle">SEAM</text>
      <text x="812" y="196" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2c3a55" text-anchor="middle">LLM 服务接缝</text>
      <text x="812" y="213" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="9" fill="#5b6d8c" text-anchor="middle">vLLM / SGLang</text>
      <text x="812" y="230" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#5b6d8c" text-anchor="middle">OpenAI 兼容 · 自托管</text>

      <!-- ===== node 6: cache ===== -->
      <rect x="724" y="256" width="176" height="88" rx="6" fill="#f5f7fb"/>
      <rect x="724" y="256" width="176" height="88" rx="6" fill="#2c3a55" stroke="#5b6d8c" stroke-width="1" fill-opacity="0.05"/>
      <rect x="732" y="262" width="42" height="12" rx="2" fill="none" stroke="#2c3a55" stroke-width="0.8" stroke-opacity="0.30"/>
      <text x="753" y="271" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="7" font-weight="500" letter-spacing="0.08em" fill="#5b6d8c" text-anchor="middle">CACHE</text>
      <text x="812" y="292" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2c3a55" text-anchor="middle">多级缓存</text>
      <text x="812" y="309" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="9" fill="#5b6d8c" text-anchor="middle">Redis</text>
      <text x="812" y="326" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#5b6d8c" text-anchor="middle">L1 结果 · L2 召回集</text>
      <text x="812" y="342" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#5b6d8c" text-anchor="middle">L3 排序 · 向量库 Milvus</text>

      <!-- ===== node 7: dual-track sink ===== -->
      <rect x="724" y="364" width="176" height="88" rx="6" fill="#f5f7fb"/>
      <rect x="724" y="364" width="176" height="88" rx="6" fill="#2c3a55" stroke="#5b6d8c" stroke-width="1" fill-opacity="0.05"/>
      <rect x="732" y="370" width="36" height="12" rx="2" fill="none" stroke="#2c3a55" stroke-width="0.8" stroke-opacity="0.30"/>
      <text x="750" y="379" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="7" font-weight="500" letter-spacing="0.08em" fill="#5b6d8c" text-anchor="middle">SINK</text>
      <text x="812" y="400" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2c3a55" text-anchor="middle">双轨落地</text>
      <text x="812" y="417" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="9" fill="#5b6d8c" text-anchor="middle">Surface / Trace</text>
      <text x="812" y="434" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#5b6d8c" text-anchor="middle">Surface → Redis(会话态)</text>
      <text x="812" y="450" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#5b6d8c" text-anchor="middle">Trace → Kafka · OTel(异步)</text>

      <!-- ===== legend ===== -->
      <line x1="36" y1="504" x2="924" y2="504" stroke="#2c3a55" stroke-width="0.8" stroke-opacity="0.14"/>
      <text x="36" y="526" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#2c3a55">① 一个 Router 按复杂度分流：~95% 走快路径（LangGraph DAG、一次编译、无 checkpointer、读缓存优先），~5% 复杂 query 走 Agentic（SSE 流式 + 硬上限）。</text>
      <text x="36" y="548" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#2c3a55">② 两层都是 LangGraph、复用同一套开源接缝（蓝线 = 网络调用）：模型 vLLM/SGLang（OpenAI 兼容）、缓存 Redis 多级、向量库 Milvus/Qdrant，无阿里内部锁定。</text>
      <text x="36" y="570" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#2c3a55">③ 双轨：Surface 按 session_id 存 Redis 供多轮续读；Trace 异步落 Kafka/OTel，不进热路径。响应——快路径直接返回，Agentic 走 SSE 流式。</text>
    </svg>
