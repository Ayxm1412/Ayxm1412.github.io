<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d9-resolve-title d9-resolve-desc" id="d-13-cordis-service-resolution-root">
      <title id="d9-resolve-title">服务解析流程</title>
      <desc id="d9-resolve-desc">读 ctx.abc 时 Proxy 的 get 陷阱依次判断：是内核字段或 accessor 就直接转发；否则做服务解析——没有 inject 声明就抛错，没有激活的 provider 就抛错或让插件停在 PENDING，都通过才按作用域返回当前实现。</desc>
      <defs>
      <style>#d-13-cordis-service-resolution-root { --paper: #f5f7fb; --ink: #2c3a55; --muted: #5b6d8c; --soft: #5b6d8c;
    --accent: #be4a22; --accent-tint: rgba(190,74,34,0.08); --rule: rgba(44,58,85,0.14);
    --sans: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
    --mono: 'SF Mono', Menlo, Consolas, monospace; }
      #d-13-cordis-service-resolution-root { font-family: var(--sans); color: var(--ink); }
      #d-13-cordis-service-resolution-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-13-cordis-service-resolution-root .diagram-container { overflow-x: visible; }</style>
        <marker id="d-13-cordis-service-resolution-d9-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b6d8c"/></marker>
        <marker id="d-13-cordis-service-resolution-d9-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#be4a22"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f7fb"/>

      <!-- arrows (before nodes) -->
      <line x1="300" y1="94" x2="300" y2="112" stroke="#5b6d8c" stroke-width="1.2" marker-end="url(#d-13-cordis-service-resolution-d9-arrow)"/>
      <line x1="388" y1="156" x2="550" y2="156" stroke="#5b6d8c" stroke-width="1.2" marker-end="url(#d-13-cordis-service-resolution-d9-arrow)"/>
      <line x1="300" y1="200" x2="300" y2="232" stroke="#5b6d8c" stroke-width="1.2" marker-end="url(#d-13-cordis-service-resolution-d9-arrow)"/>
      <line x1="400" y1="276" x2="550" y2="276" stroke="#5b6d8c" stroke-width="1.2" marker-end="url(#d-13-cordis-service-resolution-d9-arrow)"/>
      <line x1="300" y1="320" x2="300" y2="348" stroke="#5b6d8c" stroke-width="1.2" marker-end="url(#d-13-cordis-service-resolution-d9-arrow)"/>
      <line x1="410" y1="396" x2="550" y2="396" stroke="#5b6d8c" stroke-width="1.2" marker-end="url(#d-13-cordis-service-resolution-d9-arrow)"/>
      <line x1="300" y1="444" x2="300" y2="478" stroke="#be4a22" stroke-width="1.4" marker-end="url(#d-13-cordis-service-resolution-d9-arrow-accent)"/>

      <!-- branch labels -->
      <rect x="457" y="134" width="24" height="16" rx="2" fill="#f5f7fb"/>
      <text x="469" y="146" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="500" fill="#5b6d8c" text-anchor="middle">是</text>
      <rect x="308" y="208" width="24" height="16" rx="2" fill="#f5f7fb"/>
      <text x="320" y="220" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="500" fill="#5b6d8c" text-anchor="middle">否</text>
      <rect x="463" y="254" width="24" height="16" rx="2" fill="#f5f7fb"/>
      <text x="475" y="266" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="500" fill="#5b6d8c" text-anchor="middle">否</text>
      <rect x="308" y="326" width="24" height="16" rx="2" fill="#f5f7fb"/>
      <text x="320" y="338" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="500" fill="#5b6d8c" text-anchor="middle">是</text>
      <rect x="468" y="374" width="24" height="16" rx="2" fill="#f5f7fb"/>
      <text x="480" y="386" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="500" fill="#5b6d8c" text-anchor="middle">否</text>
      <rect x="308" y="453" width="24" height="16" rx="2" fill="#f5f7fb"/>
      <text x="320" y="465" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="500" fill="#be4a22" text-anchor="middle">是</text>

      <!-- start -->
      <rect x="200" y="50" width="200" height="44" rx="22" fill="#f5f7fb"/>
      <rect x="200" y="50" width="200" height="44" rx="22" fill="#ffffff" stroke="#2c3a55" stroke-width="1"/>
      <text x="300" y="77" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2c3a55" text-anchor="middle">读 ctx.abc</text>

      <!-- decision 1 -->
      <path d="M300,112 L388,156 L300,200 L212,156 Z" fill="#f5f7fb"/>
      <path d="M300,112 L388,156 L300,200 L212,156 Z" fill="#ffffff" stroke="#2c3a55" stroke-width="1"/>
      <text x="300" y="160" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2c3a55" text-anchor="middle">内核自带?</text>

      <!-- direct return -->
      <rect x="550" y="130" width="220" height="52" rx="6" fill="#f5f7fb"/>
      <rect x="550" y="130" width="220" height="52" rx="6" fill="#2c3a55" stroke="#5b6d8c" stroke-width="1" fill-opacity="0.05"/>
      <text x="660" y="152" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2c3a55" text-anchor="middle">直接返回</text>
      <text x="660" y="170" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="9" fill="#5b6d8c" text-anchor="middle">mixin -&gt; service</text>

      <!-- decision 2 -->
      <path d="M300,232 L400,276 L300,320 L200,276 Z" fill="#f5f7fb"/>
      <path d="M300,232 L400,276 L300,320 L200,276 Z" fill="#ffffff" stroke="#2c3a55" stroke-width="1"/>
      <text x="300" y="280" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2c3a55" text-anchor="middle">inject 声明了?</text>

      <!-- throw 1 -->
      <rect x="550" y="250" width="220" height="52" rx="6" fill="#f5f7fb"/>
      <rect x="550" y="250" width="220" height="52" rx="6" fill="#ffffff" stroke="#2c3a55" stroke-width="1"/>
      <text x="660" y="272" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2c3a55" text-anchor="middle">抛错</text>
      <text x="660" y="290" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="9" fill="#5b6d8c" text-anchor="middle">without inject</text>

      <!-- decision 3 -->
      <path d="M300,348 L410,396 L300,444 L190,396 Z" fill="#f5f7fb"/>
      <path d="M300,348 L410,396 L300,444 L190,396 Z" fill="#ffffff" stroke="#2c3a55" stroke-width="1"/>
      <text x="300" y="400" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2c3a55" text-anchor="middle">有 ACTIVE 实现?</text>

      <!-- throw 2 -->
      <rect x="550" y="370" width="220" height="52" rx="6" fill="#f5f7fb"/>
      <rect x="550" y="370" width="220" height="52" rx="6" fill="#ffffff" stroke="#2c3a55" stroke-width="1"/>
      <text x="660" y="392" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2c3a55" text-anchor="middle">抛错 / 等待</text>
      <text x="660" y="410" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="9" fill="#5b6d8c" text-anchor="middle">inactive · PENDING</text>

      <!-- end (happy, accent) -->
      <rect x="210" y="478" width="180" height="44" rx="22" fill="#f5f7fb"/>
      <rect x="210" y="478" width="180" height="44" rx="22" fill="#be4a22" stroke="#be4a22" stroke-width="1.2" fill-opacity="0.08"/>
      <text x="300" y="505" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2c3a55" text-anchor="middle">返回该实现</text>

      <!-- legend -->
      <line x1="40" y1="572" x2="920" y2="572" stroke="#2c3a55" stroke-width="0.8" stroke-opacity="0.14"/>
      <text x="40" y="596" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#2c3a55">读 ctx.abc：内核字段/accessor 直接转发；没 inject 就拒；没激活 provider 就拒（停 PENDING）；否则按作用域返回当前实现。</text>
    </svg>
