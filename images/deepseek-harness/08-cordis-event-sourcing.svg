<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d4-es-title d4-es-desc" id="d-08-cordis-event-sourcing-root">
      <title id="d4-es-title">Event Sourcing 双轨迹</title>
      <desc id="d4-es-desc">Agent 产生的每条事件只追加进唯一的 Session Log；Surface、Transcript、State 投影都是从这条 log 派生出来的读模型，event bus 只是瞬时通知。压缩只在 Surface 上做 replace，log 永不改写。</desc>
      <defs>
      <style>#d-08-cordis-event-sourcing-root { --paper: #f5f7fb; --ink: #2c3a55; --muted: #5b6d8c; --soft: #5b6d8c;
    --accent: #be4a22; --accent-tint: rgba(190,74,34,0.08); --rule: rgba(44,58,85,0.14);
    --sans: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
    --mono: 'SF Mono', Menlo, Consolas, monospace; }
      #d-08-cordis-event-sourcing-root { font-family: var(--sans); color: var(--ink); }
      #d-08-cordis-event-sourcing-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-08-cordis-event-sourcing-root .diagram-container { overflow-x: visible; }</style>
        <marker id="d-08-cordis-event-sourcing-d4-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b6d8c"/></marker>
        <marker id="d-08-cordis-event-sourcing-d4-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#be4a22"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f7fb"/>

      <!-- annotation -->
      <text x="624" y="72" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-style="italic" fill="#5b6d8c">压缩 = 在 Surface 上 replace，Log 一条不改</text>

      <!-- arrows (drawn before nodes) -->
      <line x1="192" y1="272" x2="312" y2="272" stroke="#5b6d8c" stroke-width="1.2" marker-end="url(#d-08-cordis-event-sourcing-d4-arrow)"/>
      <path d="M488,242 H548 Q556,242 556,234 V140 Q556,132 564,132 H624" fill="none" stroke="#5b6d8c" stroke-width="1.2" marker-end="url(#d-08-cordis-event-sourcing-d4-arrow)"/>
      <line x1="488" y1="272" x2="624" y2="272" stroke="#5b6d8c" stroke-width="1.2" marker-end="url(#d-08-cordis-event-sourcing-d4-arrow)"/>
      <path d="M488,302 H548 Q556,302 556,310 V396 Q556,404 564,404 H624" fill="none" stroke="#5b6d8c" stroke-width="1.2" marker-end="url(#d-08-cordis-event-sourcing-d4-arrow)"/>
      <line x1="400" y1="332" x2="400" y2="400" stroke="#5b6d8c" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#d-08-cordis-event-sourcing-d4-arrow)"/>

      <!-- arrow labels -->
      <rect x="228" y="252" width="48" height="12" rx="2" fill="#f5f7fb"/>
      <text x="252" y="261" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="8" fill="#5b6d8c" text-anchor="middle" letter-spacing="0.06em">append</text>
      <rect x="532" y="252" width="32" height="12" rx="2" fill="#f5f7fb"/>
      <text x="548" y="261" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="8" fill="#5b6d8c" text-anchor="middle" letter-spacing="0.06em">fold</text>
      <rect x="408" y="356" width="80" height="16" rx="2" fill="#f5f7fb"/>
      <text x="448" y="368" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="500" fill="#5b6d8c" text-anchor="middle">emit 瞬时</text>

      <!-- Agent -->
      <rect x="56" y="232" width="136" height="80" rx="6" fill="#f5f7fb"/>
      <rect x="56" y="232" width="136" height="80" rx="6" fill="#ffffff" stroke="#2c3a55" stroke-width="1"/>
      <text x="124" y="268" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2c3a55" text-anchor="middle">Agent</text>
      <text x="124" y="288" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="9" fill="#5b6d8c" text-anchor="middle">append events</text>

      <!-- Session Log (focal store) -->
      <rect x="312" y="212" width="176" height="120" rx="6" fill="#f5f7fb"/>
      <rect x="312" y="212" width="176" height="120" rx="6" fill="#be4a22" stroke="#be4a22" stroke-width="1.2" fill-opacity="0.08"/>
      <text x="400" y="264" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2c3a55" text-anchor="middle">Session Log</text>
      <text x="400" y="284" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="9" fill="#5b6d8c" text-anchor="middle">append-only</text>
      <text x="400" y="302" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#be4a22" text-anchor="middle">唯一事实源</text>

      <!-- Surface -->
      <rect x="624" y="96" width="256" height="72" rx="6" fill="#f5f7fb"/>
      <rect x="624" y="96" width="256" height="72" rx="6" fill="#2c3a55" stroke="#5b6d8c" stroke-width="1" fill-opacity="0.05"/>
      <text x="752" y="128" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2c3a55" text-anchor="middle">Surface（模型可见）</text>
      <text x="752" y="148" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="9" fill="#5b6d8c" text-anchor="middle">deriveMessages()</text>

      <!-- Transcript -->
      <rect x="624" y="236" width="256" height="72" rx="6" fill="#f5f7fb"/>
      <rect x="624" y="236" width="256" height="72" rx="6" fill="#2c3a55" stroke="#5b6d8c" stroke-width="1" fill-opacity="0.05"/>
      <text x="752" y="268" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2c3a55" text-anchor="middle">Transcript（人类可读）</text>
      <text x="752" y="288" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="9" fill="#5b6d8c" text-anchor="middle">append-origin</text>

      <!-- State projection -->
      <rect x="624" y="368" width="256" height="72" rx="6" fill="#f5f7fb"/>
      <rect x="624" y="368" width="256" height="72" rx="6" fill="#2c3a55" stroke="#5b6d8c" stroke-width="1" fill-opacity="0.05"/>
      <text x="752" y="400" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2c3a55" text-anchor="middle">State 投影</text>
      <text x="752" y="420" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="9" fill="#5b6d8c" text-anchor="middle">sessionProjections</text>

      <!-- Event Bus -->
      <rect x="312" y="400" width="176" height="64" rx="6" fill="#f5f7fb"/>
      <rect x="312" y="400" width="176" height="64" rx="6" fill="#2c3a55" stroke="#2c3a55" stroke-width="1" stroke-dasharray="4,3" fill-opacity="0.02" stroke-opacity="0.30"/>
      <text x="400" y="428" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2c3a55" text-anchor="middle">Event Bus</text>
      <text x="400" y="448" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="9" fill="#5b6d8c" text-anchor="middle">session/event</text>

      <!-- legend -->
      <line x1="40" y1="500" x2="920" y2="500" stroke="#2c3a55" stroke-width="0.8" stroke-opacity="0.14"/>
      <text x="40" y="524" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#2c3a55">一条 append-only log 是唯一事实源；Surface / Transcript / Projection 都是它的派生投影（读模型）；event bus 是瞬时通知，不是状态。</text>
    </svg>
