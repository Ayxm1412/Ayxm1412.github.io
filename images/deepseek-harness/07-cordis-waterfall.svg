<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d3-waterfall-title d3-waterfall-desc" id="d-07-cordis-waterfall-root">
      <title id="d3-waterfall-title">waterfall 拦截链</title>
      <desc id="d3-waterfall-desc">ctx.waterfall 派发一个事件时，监听器依次包裹：调用 next() 就把可能改写过的结果委托给下游直到内置行为，不调用 next() 就地否决整条链，对应操作系统的 filter driver 或 LSM 钩子链。</desc>
      <defs>
      <style>#d-07-cordis-waterfall-root { --paper: #f5f7fb; --ink: #2c3a55; --muted: #5b6d8c; --soft: #5b6d8c;
    --accent: #be4a22; --accent-tint: rgba(190,74,34,0.08); --rule: rgba(44,58,85,0.14);
    --sans: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
    --mono: 'SF Mono', Menlo, Consolas, monospace; }
      #d-07-cordis-waterfall-root .dd-page { font-family: var(--sans); background: var(--paper); color: var(--ink); padding: 2rem 1.5rem; }
      #d-07-cordis-waterfall-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-07-cordis-waterfall-root .diagram-container { overflow-x: visible; }</style>
        <marker id="d-07-cordis-waterfall-d3-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b6d8c"/></marker>
        <marker id="d-07-cordis-waterfall-d3-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#be4a22"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f7fb"/>

      <!-- arrows (drawn before nodes) -->
      <line x1="300" y1="110" x2="300" y2="134" stroke="#5b6d8c" stroke-width="1.2" marker-end="url(#d-07-cordis-waterfall-d3-arrow)"/>
      <line x1="300" y1="186" x2="300" y2="204" stroke="#5b6d8c" stroke-width="1.2" marker-end="url(#d-07-cordis-waterfall-d3-arrow)"/>
      <line x1="300" y1="296" x2="300" y2="330" stroke="#5b6d8c" stroke-width="1.2" marker-end="url(#d-07-cordis-waterfall-d3-arrow)"/>
      <line x1="300" y1="382" x2="300" y2="410" stroke="#5b6d8c" stroke-width="1.2" marker-end="url(#d-07-cordis-waterfall-d3-arrow)"/>
      <!-- veto path (accent): diamond -> short-circuit -->
      <line x1="386" y1="250" x2="580" y2="250" stroke="#be4a22" stroke-width="1.4" marker-end="url(#d-07-cordis-waterfall-d3-arrow-accent)"/>

      <!-- arrow labels -->
      <rect x="308" y="305" width="80" height="16" rx="2" fill="#f5f7fb"/>
      <text x="348" y="317" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="500" fill="#5b6d8c" text-anchor="middle">是 · next()</text>
      <rect x="447" y="224" width="72" height="16" rx="2" fill="#f5f7fb"/>
      <text x="483" y="236" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="500" fill="#be4a22" text-anchor="middle">否 · 不调用</text>

      <!-- start oval -->
      <rect x="150" y="58" width="300" height="52" rx="24" fill="#f5f7fb"/>
      <rect x="150" y="58" width="300" height="52" rx="24" fill="#ffffff" stroke="#2c3a55" stroke-width="1"/>
      <text x="300" y="80" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2c3a55" text-anchor="middle">事件派发</text>
      <text x="300" y="99" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="9" fill="#5b6d8c" text-anchor="middle">ctx.waterfall(args, next)</text>

      <!-- listener 1 -->
      <rect x="210" y="134" width="180" height="52" rx="6" fill="#f5f7fb"/>
      <rect x="210" y="134" width="180" height="52" rx="6" fill="#ffffff" stroke="#2c3a55" stroke-width="1"/>
      <text x="300" y="157" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2c3a55" text-anchor="middle">监听器 1</text>
      <text x="300" y="175" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="9" fill="#5b6d8c" text-anchor="middle">(...args, next)</text>

      <!-- decision diamond -->
      <path d="M300,204 L386,250 L300,296 L214,250 Z" fill="#f5f7fb"/>
      <path d="M300,204 L386,250 L300,296 L214,250 Z" fill="#ffffff" stroke="#2c3a55" stroke-width="1"/>
      <text x="300" y="254" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2c3a55" text-anchor="middle">调用 next()?</text>

      <!-- listener 2 -->
      <rect x="210" y="330" width="180" height="52" rx="6" fill="#f5f7fb"/>
      <rect x="210" y="330" width="180" height="52" rx="6" fill="#ffffff" stroke="#2c3a55" stroke-width="1"/>
      <text x="300" y="353" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2c3a55" text-anchor="middle">监听器 2 …</text>
      <text x="300" y="371" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="9" fill="#5b6d8c" text-anchor="middle">next() delegate</text>

      <!-- end oval: built-in behavior -->
      <rect x="200" y="410" width="200" height="44" rx="20" fill="#f5f7fb"/>
      <rect x="200" y="410" width="200" height="44" rx="20" fill="#2c3a55" stroke="#5b6d8c" stroke-width="1" fill-opacity="0.05"/>
      <text x="300" y="430" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2c3a55" text-anchor="middle">内置行为</text>
      <text x="300" y="446" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="9" fill="#5b6d8c" text-anchor="middle">innermost next()</text>

      <!-- veto oval (focal accent) -->
      <rect x="580" y="224" width="200" height="52" rx="20" fill="#f5f7fb"/>
      <rect x="580" y="224" width="200" height="52" rx="20" fill="#be4a22" stroke="#be4a22" stroke-width="1" fill-opacity="0.08"/>
      <text x="680" y="247" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2c3a55" text-anchor="middle">短路返回</text>
      <text x="680" y="265" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="9" fill="#5b6d8c" text-anchor="middle">no next() -&gt; veto</text>

      <!-- legend strip -->
      <line x1="40" y1="500" x2="920" y2="500" stroke="#2c3a55" stroke-width="0.8" stroke-opacity="0.14"/>
      <text x="40" y="528" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#2c3a55">对应 OS：waterfall 是 around-middleware，每个监听器像 filter driver / LSM 钩子 —— 调用 next() 委托下游，不调用就地否决整条链。</text>
    </svg>
